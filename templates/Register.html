{% extends 'Base.html' %} 
{% load static %} 
{% block content %}

<style>
.register-page {
  background: radial-gradient(circle at top left, #0f172a, #020617);
}

.register-page .f-div {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 450px;
  margin-bottom: 80px;
}

.register-page .ff-div {
  width: 100%;
  max-width: 420px;
  height: 450px;
  padding: 25px;
  border-radius: 20px;

  background: rgba(255, 255, 255, 0.04);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.08);

  box-shadow:
    0 10px 30px rgba(0, 0, 0, 0.6),
    inset 0 0 20px rgba(255, 255, 255, 0.03);

  display: flex;
  flex-direction: column;
  justify-content: space-between;

  overflow: hidden;
  animation: fadeIn 0.6s ease;
}

.register-page .ff-div h4 {
  text-align: center;
  margin-bottom: 15px;
  color: #38bdf8;
  font-weight: 600;
  letter-spacing: 1px;
}

.register-page .form-control {
  background: rgba(30, 41, 59, 0.8) !important;
  border: 1px solid rgba(255, 255, 255, 0.06) !important;
  color: #fff !important;
  border-radius: 10px;
  padding: 10px;
  transition: 0.3s;
}

.register-page .form-control::placeholder {
  color: #94a3b8;
}

.register-page .form-control:focus {
  box-shadow: 0 0 12px rgba(56, 189, 248, 0.6) !important;
  border: 1px solid #38bdf8 !important;
  background: rgba(30, 41, 59, 1) !important;
}

.register-page .mb-3 {
  margin-bottom: 14px !important;
}

.register-page #signup-btn {
  width: 100%;
  border-radius: 10px;
  background: linear-gradient(135deg, #38bdf8, #6366f1);
  border: none;
  padding: 10px;
  margin-bottom:10px;
  font-weight: 600;
  position: relative;
  overflow: hidden;
  transition: 0.3s;
}

.register-page #signup-btn::before {
  content: "";
  position: absolute;
  width: 120%;
  height: 100%;
  background: linear-gradient(
    120deg,
    transparent,
    rgba(255, 255, 255, 0.4),
    transparent
  );
  top: 0;
  left: -120%;
  transition: 0.5s;
}

.register-page #signup-btn:hover::before {
  left: 100%;
}

.register-page #signup-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 20px rgba(99, 102, 241, 0.6);
}

.text-center a {
  color: #38bdf8 !important;
  text-decoration: none;
  font-size: 14px;
}

.text-center a:hover {
  color: #6366f1 !important;
}

.register-page #error-message {
  font-size: 13px;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(25px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>

<div class="container register-page">
  <div class="row f-div">
    <div class="col-md-6 ff-div">
      <h4>Register</h4>

      <form method="post" id="register-form">
        {% csrf_token %}

        <div>
          <div class="mb-3">
            <input
              type="text"
              class="form-control"
              placeholder="Enter your name"
              id="register-name"
              name="name"
              required
            />
          </div>

          <div class="mb-3">
            <input
              type="email"
              class="form-control"
              placeholder="Enter your email"
              id="register-email"
              name="email"
              required
            />
          </div>

          <div class="mb-3">
            <input
              type="password"
              class="form-control"
              placeholder="Enter your password"
              id="register-password"
              name="password"
              required
            />
          </div>

          <span id="error-message" class="text-danger"></span>
        </div>

        <div>
          <button type="submit" id="signup-btn">Create Account</button>

          <p class="text-center">
            <a href="{% url 'login' %}">Already have an account? Log-in</a>
          </p>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.js"></script>

<script>
  $("#register-form").on("submit", function (e) {
    e.preventDefault();
    $("#error-message").empty();

    var spinner = `<div class="spinner-border text-light" role="status">
        <span class="visually-hidden">Loading...</span>
        </div>`;

    $("#signup-btn").html(spinner);
    $("#signup-btn").prop("disabled", true);

    $.ajax({
      type: "POST",
      url: '{% url "register" %}',
      data: {
        name: $("#register-name").val(),
        email: $("#register-email").val(),
        password: $("#register-password").val(),
        csrfmiddlewaretoken: $("input[name=csrfmiddlewaretoken]").val(),
      },
      success: function (response) {
        if (response.success) {
          window.location.href = "{% url 'home' %}";
        } else {
          $("#error-message").text(response.error);
          $("#signup-btn").text("Create Account");
          $("#signup-btn").removeAttr("disabled");
        }
      },
    });
  });
</script>

{% endblock %}
