{% extends 'Base.html' %}
{% load static %}
{% block content %}

<style>
.contact-page {
  background: radial-gradient(circle at top left, #0f172a, #020617);
  padding-top: 20px;
}

.contact-page .main {
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.contact-page .card-box {
  width: 100%;
  max-width: 420px;
  margin-top:70px;
  padding: 25px;
  border-radius: 20px;

  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.08);

  box-shadow: 
    0 10px 30px rgba(0,0,0,0.6),
    inset 0 0 20px rgba(255,255,255,0.03);

  animation: fadeIn 0.6s ease;
  margin-bottom:70px;
}

.contact-page h4 {
  text-align: center;
  margin-bottom: 5px;
  color: #38bdf8;
  font-weight: 600;
}

.contact-page h6 {
  text-align: center;
  color: #94a3b8;
  margin-bottom: 18px;
  font-size: 13px;
}

.contact-page input,
.contact-page textarea {
  width: 100%;
  padding: 10px;
  margin-bottom: 12px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.06);
  background: rgba(30,41,59,0.8);
  color: #fff;
  transition: 0.3s;
}

.contact-page input::placeholder,
.contact-page textarea::placeholder {
  color: #94a3b8;
}

.contact-page input:focus,
.contact-page textarea:focus {
  outline: none;
  border: 1px solid #38bdf8;
  box-shadow: 0 0 12px rgba(56,189,248,0.6);
  background: rgba(30,41,59,1);
}

.contact-page input[type="submit"] {
  width: 100%;
  border-radius: 10px;
  background: linear-gradient(135deg, #38bdf8, #6366f1);
  border: none;
  padding: 10px;
  font-weight: 600;
  position: relative;
  overflow: hidden;
  transition: 0.3s;
}

.contact-page input[type="submit"]::before {
  content: "";
  position: absolute;
  width: 120%;
  height: 100%;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,0.4), transparent);
  top: 0;
  left: -120%;
  transition: 0.5s;
}

.contact-page input[type="submit"]:hover::before {
  left: 100%;
}

.contact-page input[type="submit"]:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 20px rgba(99,102,241,0.6);
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(25px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
</style>

<div class="container contact-page">
  <div class="main">
    <div class="card-box">

      <form action="" method="post">
        {% csrf_token %}

        <h4>Contact Form</h4>
        <h6>Please fill all entries</h6>

        <input type="email" name="email" placeholder="Enter your email" required>
        <input type="text" name="name" placeholder="Enter your name" required>
        <textarea name="message" rows="3" placeholder="Enter your message" required></textarea>

        <input type="submit" value="Send Message">

      </form>

    </div>
  </div>
</div>

{% endblock %}
