{% extends 'Base.html' %}
{% load static %}
{% block content %}

<style>

/* ===== CENTER WRAPPER ===== */
.f-div {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 80vh;
}

/* ===== CARD ===== */
.ff-div {
  width: 100%;
  max-width: 420px;
  height:420px;
  padding: 30px;
  border-radius: 18px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(15px);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  animation: fadeIn 0.6s ease;
  margin-bottom:80px;
}

/* ===== TITLE ===== */
.ff-div h4 {
  text-align: center;
  margin-bottom: 20px;
  color: #38bdf8;
  font-weight: 600;
}

/* ===== INPUT ===== */
.form-control {
  background: #1e293b !important;
  border: none !important;
  color: #fff !important;
  border-radius: 8px;
  padding: 10px;
  margin-top:40px;
  margin-bottom:40px;
}

.form-control:focus {
  box-shadow: 0 0 10px rgba(56,189,248,0.5) !important;
  border: 1px solid #38bdf8 !important;
}

/* ===== LABEL ===== */
.form-label {
  color: #94a3b8;
  font-size: 14px;
}

/* ===== SMALL TEXT ===== */
.form-text {
  color: #64748b !important;
}

/* ===== BUTTON ===== */
#login-btn {
  width: 100%;
  border-radius: 8px;
  background: linear-gradient(45deg, #38bdf8, #6366f1);
  border: none;
  margin-bottom:20px;
  transition: 0.3s;
}

#login-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 15px rgba(99,102,241,0.6);
}

/* ===== LINK ===== */
.text-primary a {
  color: #38bdf8 !important;
  text-decoration: none;
  font-size: 14px;
  padding-left:75px;

}

.text-primary a:hover {
  color: #6366f1 !important;
}

/* ===== ERROR ===== */
#error-message1 {
  font-size: 13px;
}

/* ===== ANIMATION ===== */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

</style>

<div class="container">
  <div class="row f-div">
    <div class="col-md-6 ff-div">

      <h4> Log-in </h4>

      <form method ="post" id ="login-form">
       {% csrf_token %}

        <div class="mb-3">
          {% comment %} <label class="form-label">Email address</label> {% endcomment %}
          <input type="email" name="email" class="form-control" placeholder="enter your email" id="login-email">
          {% comment %} <div class="form-text">We'll never share your email with anyone else.</div> {% endcomment %}
        </div>

        <div class="mb-3">
          {% comment %} <label class="form-label">Password</label> {% endcomment %}
          <input type="password" id="login-password" placeholder="enter your password" name="password" class="form-control">
        </div>

        <div>
          <span id="error-message1" class="text-danger ml-2"></span>
        </div>

        <button id='login-btn' type="submit" class="btn btn-primary">Submit</button>

      </form>

       <p class="text-primary">
           <a href="{% url 'register' %}">Don't have an account? Register</a> 
          </p>

    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.js"></script>

<script type="text/javascript">
  $(document).on("submit", "#login-form", function (e) {
    e.preventDefault();
    $("#error-message").empty();

    var spinner = `<div class="spinner-border text-light" role="status">
            <span class="visually-hidden">Loading...</span>
            </div>`;

    $("#login-btn").html(spinner);
    $("#login-btn").prop('disabled',true);

    $.ajax({
      type: "POST",
      url: '{% url "login" %}',
      data: {
        email: $("#login-email").val(),
        password: $("#login-password").val(),
        login_rember: $("#login-check").prop("checked") ? "on" : "",
        csrfmiddlewaretoken: $("input[name=csrfmiddlewaretoken]").val(),
      },
      success: function (response) {
        if (response.success) {
          window.location.href = "{% url 'home' %}";
        } else {
          $("#error-message1").text(response.error);
          $("#login-btn").text("Login");
          $("#login-btn").removeAttr('disabled')
        }
      },
    });
  });
</script>

{% endblock %}
